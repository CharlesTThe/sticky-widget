name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  widget:
    name: Widget E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run widget tests
        run: npx playwright test tests/widget.spec.js tests/stress.spec.js

  backend:
    name: Backend (security + idempotency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sticky_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sticky_test
      TEST_BACKEND: '1'
      API_SECRET: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply schema
        run: psql "$DATABASE_URL" -f server/schema.sql
      - name: Start server
        run: |
          npm run server &
          for i in {1..20}; do curl -sf http://localhost:3001/api/v1/feedback -H "x-api-key: $API_SECRET" > /dev/null && break || sleep 1; done
      - name: Run backend tests
        run: npx playwright test tests/security.spec.js
