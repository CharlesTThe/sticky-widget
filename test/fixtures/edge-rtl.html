<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: right to left</title>
  <!-- Trap: dir="rtl" on the root element flips the inline axis for the
       whole document, including anything injected into it. A widget that
       positions its chrome with left/right offsets, or that relies on the
       default text direction inside its own panels, comes out mirrored
       unless it sets dir explicitly on its own root. -->
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      color: #1a222d;
      background: #ffffff;
    }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #616f80; margin: 0 0 14px; max-width: 620px; }
  </style>
</head>
<body>
  <h1>صفحة اختبار بالاتجاه من اليمين إلى اليسار</h1>
  <p>هذا نص بديل لأغراض الاختبار فقط ولا يحمل أي معنى محدد.</p>
  <p>يستخدم هذا الملف لفحص سلوك الواجهة عندما يكون اتجاه الصفحة من اليمين إلى اليسار.</p>
  <p>الأرقام تظهر هكذا: ١٢٣٤ و 5678 في نفس السطر.</p>
</body>
</html>
