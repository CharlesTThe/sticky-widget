<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: UTF-8 BOM</title>
  <!-- Trap: this file begins with a UTF-8 byte order mark, EF BB BF, before
       the doctype. Read as UTF-8 the BOM becomes a leading U+FEFF character,
       so a check for a file starting with the doctype fails, and an injector
       that rewrites the file without preserving those three bytes changes how
       the browser sniffs the encoding. -->
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a222d;
      background: #ffffff;
    }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: #616f80; margin: 0; max-width: 620px; }
  </style>
</head>
<body>
  <h1>UTF-8 byte order mark</h1>
  <p>The first three bytes of this file are EF BB BF. Round-trip check: caf&eacute;, na&iuml;ve, 42&nbsp;&euro;.</p>
</body>
</html>
