<!-- Trap: this document has no opening and no closing body tag anywhere in
     the source, in either case. Neither token appears even inside a comment,
     so there is genuinely nothing for a text search to find. The browser
     synthesises a body element regardless, but an injector looking for a
     closing body tag to insert before has to fall back to appending at the
     end of the document. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: no body tag</title>
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a222d;
      background: #ffffff;
    }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: #616f80; margin: 0; max-width: 620px; }
  </style>
</head>

<h1>No body tag</h1>
<p>The markup jumps straight from the head to flow content. There is no opening or closing body tag in the source at all.</p>
</html>
