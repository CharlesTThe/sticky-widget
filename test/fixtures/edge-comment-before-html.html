<!DOCTYPE html><!--build:abc123--><html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: comment before html</title>
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a222d;
      background: #ffffff;
    }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: #616f80; margin: 0; max-width: 620px; }
  </style>
</head>
<!-- Trap: a build-stamp comment sits between the doctype and the root
     element, on the same line. An injector that assumes the first line is
     the doctype alone, or that splits on the root tag without accounting
     for a prelude, mangles the head of the file. -->
<body>
  <h1>Comment before html</h1>
  <p>A doctype and a build-stamp comment share the first line with the opening root tag.</p>
</body>
</html>
