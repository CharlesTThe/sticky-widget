<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: CRLF line endings</title>
  <!-- Trap: every line in this file ends with CR LF rather than a bare LF.
       Byte offsets computed against an LF assumption drift by one byte per
       preceding line, and any injector that rejoins lines with "\n" silently
       rewrites the whole file's line endings as a side effect. -->
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a222d;
      background: #ffffff;
    }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: #616f80; margin: 0; max-width: 620px; }
  </style>
</head>
<body>
  <h1>CRLF line endings</h1>
  <p>Saved with Windows line terminators throughout, including the final line.</p>
</body>
</html>
