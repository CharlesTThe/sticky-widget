<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Trap: React-style attribute casing. The DOM property is charSet, and
       server-rendered React output carries that capital S straight into the
       HTML. Browsers match attribute names case-insensitively, so this is a
       valid encoding declaration, but a case-sensitive search for the
       lowercase spelling misses it. -->
  <meta charSet="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Fixture: React-style charSet</title>
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1a222d;
      background: #ffffff;
    }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: #616f80; margin: 0; max-width: 620px; }
  </style>
</head>
<body>
  <h1>Encoding via charSet</h1>
  <p>Self-closing meta tags with a capital S, as emitted by a server-rendered React app. Round-trip check: caf&eacute;, na&iuml;ve, 42&nbsp;&euro;.</p>
</body>
</html>
